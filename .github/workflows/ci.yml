name: ci
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited]
# The `railform` job runs railform's reusable workflow at the pinned commit: the four
# Definition-of-Done gates plus `uv lock --check` on Ubuntu and Windows, the commit lane, the
# hook checks and zizmor (railform.toml holds the frame it reads). `changelog-currency` is
# keel's own job, kept here so that `gate` covers it. `gate` is the one required status.
# The default GITHUB_TOKEN grant is wider than anything here needs: every job only checks the
# repository out and runs local commands (the marker arm's ::warning and step summary need no
# token scope at all). Least privilege, stated once at the top level.
permissions:
  contents: read
jobs:
  # >>> railform: owned by `railform adopt`; `railform adopt --check` fails on any edit
  railform:
    uses: grimaldost/railform/.github/workflows/python-ci.yml@c850db5b8989a2b8152a3b2e918c32d8c20f7197
    permissions:
      contents: read
    with:
      railform-sha: c850db5b8989a2b8152a3b2e918c32d8c20f7197
  gate:
    if: always()
    needs: [railform, changelog-currency]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Fail when a needed job failed or was cancelled
        if: always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
        shell: bash
        run: exit 1
  # <<< railform
  changelog-currency:
    # CONTRIBUTING step 4, machine-enforced (KEEL-B08): a diff that ships kit or doctrine while
    # CHANGELOG.md stays untouched is an unrecorded promotion — and an unrecorded promotion is
    # uncountable. PR-only: the base ref is what makes the diff meaningful.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the merge-base with the target branch has to exist locally
          persist-credentials: false
      - env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git diff --name-only "origin/${BASE_REF}...HEAD" \
            | python scripts/changelog_currency.py
      # Version arm: a PR that cuts a new release heading must move the newest version strictly
      # forward; the version-consistency test, run by the `railform` job's pipeline, holds the
      # version sites to that same heading (CONTRIBUTING, "Release discipline", owns the
      # enumeration).
      - env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git show "origin/${BASE_REF}:CHANGELOG.md" > "$RUNNER_TEMP/base-changelog.md"
          python scripts/changelog_currency.py --headings "$RUNNER_TEMP/base-changelog.md" CHANGELOG.md
      # Marker arm (advisory, never fails): a change to a contract-surface file — the gate
      # ledger's schema, the CLI's exit-code surface — should carry the `(consumer-affecting)`
      # marker on an added entry line under `## [Unreleased]` (else the newest release heading).
      # Fires as a ::warning annotation, not a red.
      - env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git diff "origin/${BASE_REF}...HEAD" -- CHANGELOG.md > "$RUNNER_TEMP/changelog.diff"
          git diff --name-only "origin/${BASE_REF}...HEAD" \
            | python scripts/changelog_currency.py --marker "$RUNNER_TEMP/changelog.diff" CHANGELOG.md
