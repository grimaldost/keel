name: ci
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited]
# The `railform` job runs railform's reusable workflow at the pinned commit: the four
# Definition-of-Done gates plus `uv lock --check` on Ubuntu and Windows, the commit lane, the
# changelog gate, the version-site check, the hook checks and zizmor (railform.toml holds the
# frame it reads). `gate` is the one required status.
# The default GITHUB_TOKEN grant is wider than anything here needs: the jobs only check the
# repository out and run local commands. Least privilege, stated once at the top level.
permissions:
  contents: read
jobs:
  # >>> railform: owned by `railform adopt`; `railform adopt --check` fails on any edit
  railform:
    uses: grimaldost/railform/.github/workflows/python-ci.yml@3e6f27f8970700c5166b908fae65572c431b2571
    permissions:
      contents: read
    with:
      railform-sha: 3e6f27f8970700c5166b908fae65572c431b2571
  gate:
    if: always()
    needs: [railform]
    runs-on: ${{ github.actor != 'dependabot[bot]' && github.event.pull_request.user.login != 'dependabot[bot]' && fromJSON(vars.LINUX_RUNS_ON || '"ubuntu-latest"') || 'ubuntu-latest' }}
    permissions: {}
    steps:
      - name: Fail when a needed job failed or was cancelled
        if: always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
        shell: bash
        run: exit 1
  # <<< railform
