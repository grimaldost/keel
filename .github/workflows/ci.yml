name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history AND tags: the release-flow tag assertions skip a tagless checkout, and the default shallow checkout is exactly that
      - uses: astral-sh/setup-uv@v5
      - run: uv lock --check # the committed uv.lock (a version site; CONTRIBUTING, "Release discipline") must be current; a stale lock reds CI
      - run: uv sync --group dev
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run ty check src
      - run: uv run pytest

  changelog-currency:
    # CONTRIBUTING step 4, machine-enforced (KEEL-B08): a diff that ships kit or doctrine while
    # CHANGELOG.md stays untouched is an unrecorded promotion — and an unrecorded promotion is
    # uncountable. PR-only: the base ref is what makes the diff meaningful.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the merge-base with the target branch has to exist locally
      - run: |
          git diff --name-only "origin/${{ github.base_ref }}...HEAD" \
            | python scripts/changelog_currency.py
      # Version arm: a PR that cuts a new release heading must move the newest version strictly
      # forward; the version-consistency test in the `check` job holds the version sites to
      # that same heading (CONTRIBUTING, "Release discipline", owns the enumeration).
      - run: |
          git show "origin/${{ github.base_ref }}:CHANGELOG.md" > "$RUNNER_TEMP/base-changelog.md"
          python scripts/changelog_currency.py --headings "$RUNNER_TEMP/base-changelog.md" CHANGELOG.md
      # Marker arm (advisory, never fails): a change to a contract-surface file — the gate
      # ledger's schema, the CLI's exit-code surface — should carry the `(consumer-affecting)`
      # marker on an added entry line under the newest release heading. Fires as a ::warning
      # annotation, not a red.
      - run: |
          git diff "origin/${{ github.base_ref }}...HEAD" -- CHANGELOG.md > "$RUNNER_TEMP/changelog.diff"
          git diff --name-only "origin/${{ github.base_ref }}...HEAD" \
            | python scripts/changelog_currency.py --marker "$RUNNER_TEMP/changelog.diff" CHANGELOG.md
