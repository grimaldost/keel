name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv lock --check # the committed uv.lock (eighth version site) must be current; a stale lock reds CI
      - run: uv sync --group dev
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run ty check src
      - run: uv run pytest

  changelog-currency:
    # CONTRIBUTING step 4, machine-enforced (KEEL-B08): a diff that ships kit or doctrine while
    # CHANGELOG.md stays untouched is an unrecorded promotion — and an unrecorded promotion is
    # uncountable. PR-only: the base ref is what makes the diff meaningful.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the merge-base with the target branch has to exist locally
      - run: |
          git diff --name-only "origin/${{ github.base_ref }}...HEAD" \
            | python scripts/changelog_currency.py
