# Three of the four Definition-of-Done gates, at commit time. `uv run pytest` is the fourth
# and stays in CI: it is the one gate whose cost belongs on a push, not on every commit.
# The railform entry, written by `railform adopt` at the pinned commit, holds the commit
# subject to Conventional Commits and rejects AI-attribution trailers (commit-msg), checks the
# branch name (pre-push), and checks the hook wrappers and private references (pre-commit);
# the hygiene entry beside it runs the pre-commit-hooks set. The wrappers in `.githooks/` run
# each stage; arm a clone once with `railform arm` (see CONTRIBUTING, "Quality gates").
# ruff and ty run through `uv run`, so the hook uses the version uv.lock pins, the one CI runs;
# a separately pinned hook repository had drifted a minor version behind it.
# A hook that names no stage runs only at commit time. Without this, check-merge-conflict
# (given --assume-in-merge) also judges the commit message, so a message that quotes a conflict
# marker is refused, and the local ruff and ty hooks would run again on every push. The railform
# hooks name their own stages in railform's manifest, so this leaves them as they are.
default_stages: [pre-commit]
repos:
  # >>> railform: owned by `railform adopt`; `railform adopt --check` fails on any edit
  - repo: https://github.com/grimaldost/railform
    rev: 65bf54ae6f4ed7bd027fee9e0806d9dfa2df3c48
    hooks:
      - id: railform-commit-msg
      - id: railform-branch-name
      - id: railform-hooks-check
        files: '^\.githooks/'
      - id: railform-private-refs
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: cef0300fd0fc4d2a87a85fa2093c6b283ea36f4b  # frozen: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        stages: [pre-commit]
      - id: end-of-file-fixer
        stages: [pre-commit]
      - id: check-merge-conflict
        args: [--assume-in-merge]
        stages: [pre-commit]
      - id: check-added-large-files
        stages: [pre-commit]
      - id: check-yaml
        stages: [pre-commit]
      - id: check-toml
        stages: [pre-commit]
      - id: check-json
        stages: [pre-commit]
  # <<< railform
  - repo: local
    hooks:
      - id: ruff
        name: ruff check --fix
        entry: uv run ruff check --force-exclude --fix
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ty
        name: ty check src
        entry: uv run ty check src
        language: system
        pass_filenames: false
        files: ^src/.*\.py$
