[project]
name = 'keel'
version = '0.4.0'
description = 'The method: gates, templates, and doctrine for artifact-and-machine-governed development.'
readme = 'README.md'
requires-python = '>=3.11'
authors = [
    { name = 'Grimaldo Stanzani', email = 'grimaldosj93@gmail.com' },
]
classifiers = [
    'License :: OSI Approved :: MIT License',
    'Private :: Do Not Upload',
]
dependencies = [
    'typer>=0.12',
]

[project.scripts]
keel = 'keel.cli:main'

[build-system]
requires = ['uv_build>=0.5,<0.12']
build-backend = 'uv_build'

[dependency-groups]
lint = ['ruff>=0.15', 'ty']
test = ['pytest>=8.0', 'pytest-cov']
dev = [
    { include-group = 'lint' },
    { include-group = 'test' },
    'pre-commit',
]

[tool.ruff]
line-length = 100
target-version = 'py311'
src = ['src', 'tests']

[tool.ruff.format]
quote-style = 'single'

[tool.ruff.lint]
select = ['E', 'F', 'W', 'B', 'I', 'N', 'UP', 'S', 'TC', 'RUF']
ignore = ['S603', 'S607']

[tool.ruff.lint.per-file-ignores]
'tests/**' = ['S101', 'TC003']

[tool.ruff.lint.isort]
known-first-party = ['keel']

[tool.pytest.ini_options]
testpaths = ['tests']
addopts = '--strict-markers --strict-config -ra'
