# The adversarial positive-control corpus (T0.2).
#
# Each row is ONE minimal edit to `clean-series.md`, plus the exact set of check ids that edit
# must make fire. The assertion is set EQUALITY, never membership: a mutant that trips three
# checks is a bad fixture, not a strong one, because it no longer isolates the check it claims
# to prove. `clean-series.md` itself must fire nothing — it is the false-positive floor every
# mutant is diffed against.
#
# What this corpus buys: R1(b), the "power" leg of the cut procedure. A check that has never
# fired in the field is either sharp-and-internalised or broken, and those look identical from
# the outside. A mutant that fires proves the check CAN see its defect; a mutant that does not
# fire is a reproduced defeat, and silence from a defeated check is uninformative in both
# directions. Routing that question to a paid agent bank would buy the same bit with variance.
#
# Fields
#   id       the fixture name
#   fires    the exact set of check ids expected (violations and warnings together)
#   why      what obligation this row discharges
#   find     literal text in clean-series.md (must match exactly once)
#   replace  what it becomes; omit both to mutate only the certification artifact
#   artifact_verdict / artifact_hash   override what the staged pre-mortem artifact records
#   repeat   render `replace` N times, with {n} (1-based), {true_line} and {shifted_line}
#   xfail    a REPRODUCED DEFEAT: the check cannot see this defect today, and the reason why
#
# The corpus is not a keel document and names no keel concept: an oracle that shares vocabulary
# with the thing it measures cannot report on it.

[[mutant]]
id = "A0-unknown-kind"
fires = ["A0"]
why = "A0 shipped after every spec in the census, so it has never had material"
find = "- **Kind:** series"
replace = "- **Kind:** hotfix"

